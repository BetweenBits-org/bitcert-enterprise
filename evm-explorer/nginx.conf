# Otterscan for the sandbox's settlement chain (anvil, chain 31337), on :5106.
#
# Pages and RPC share one origin, so the browser needs no CORS and the chain's
# own RPC is never reachable from outside: /rpc goes to the read-only gateway
# on loopback (gateway.mjs), which forwards only methods that read.
server {
    listen 5106;
    server_name _;
    gzip_static on;
    root /usr/share/nginx/html;

    location = /rpc {
        proxy_pass http://127.0.0.1:5107;
        # Set, not appended: the gateway rate-limits on this value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 256k;
        proxy_read_timeout 15s;
    }
    location /static     { expires max; }
    location /assets     { expires 30d; }
    location /chains     { expires 30d; }
    location /signatures { expires 30d; default_type text/plain; }
    location /topic0     { expires 30d; default_type text/plain; }
    location / {
        index index.html;
        try_files $uri /index.html;
    }
}
