# Settings of the service itself come from the environment (see config/CoreConfig.java):
# PORT, HOST, STONEHASH_DB_URL and the rest, under the names it has always read.
# This file only tells the framework to stay out of the way.
spring.main.banner-mode=off
spring.jmx.enabled=false
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z',UTC} %-5level %logger{32} - %msg%n

# SQL lives in XML mappers, one file per area. A column that is NULL is still a column of the row.
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.call-setters-on-nulls=true
mybatis.configuration.map-underscore-to-camel-case=false
# A row whose every selected column is NULL is still a row.
mybatis.configuration.return-instance-for-empty-row=true
